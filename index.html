  }

/* ============ SCROLL REVEAL HOOK ============ */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(
      ".reveal, .reveal-left, .reveal-right, .reveal-scale"
    );
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("active");
            obs.unobserve(e.target);
          }
        });
      },
      { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ============ FLOATING PARTICLES ============ */
function FloatingParticles() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let particles = [];
    let raf;

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    const make = () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      sy: -(Math.random() * 0.4 + 0.15),
      sx: (Math.random() - 0.5) * 0.3,
      o: Math.random() * 0.5 + 0.2,
      hue: Math.random() > 0.5 ? 340 : 30,
    });

    for (let i = 0; i < 60; i++) particles.push(make());

    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.y += p.sy;
        p.x += p.sx;
        if (p.y < -10) {
          particles[i] = make();
          particles[i].y = canvas.height + 10;
        }
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        g.addColorStop(0, `hsla(${p.hue}, 70%, 75%, ${p.o})`);
        g.addColorStop(1, `hsla(${p.hue}, 70%, 60%, 0)`);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      });
      raf = requestAnimationFrame(animate);
    };
    animate();
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
    };
  }, []);

  return (
    <>
      <div className="fixed inset-0 pointer-events-none z-0">
        <div className="absolute top-1/4 -left-20 w-96 h-96 rounded-full bg-rose-600/30 glow-orb animate-glow" />
        <div className="absolute top-2/3 -right-20 w-96 h-96 rounded-full bg-gold-400/20 glow-orb animate-glow" style={{ animationDelay: "2s" }} />
        <div className="absolute bottom-0 left-1/3 w-80 h-80 rounded-full bg-rose-400/20 glow-orb animate-glow" style={{ animationDelay: "1s" }} />
      </div>
      <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[1]" />
    </>
  );
}

/* ============ SOUNDTRACK ============ */
function Soundtrack() {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);

  const togglePlay = () => {
    const a = audioRef.current;
    if (!a) return;
    if (playing) a.pause(); else a.play().catch(() => {});
    setPlaying(!playing);
  };

  const onTime = () => {
    const a = audioRef.current;
    if (a && a.duration) setProgress((a.currentTime / a.duration) * 100);
  };

  const seek = (e) => {
    const a = audioRef.current;
    if (!a || !a.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    a.currentTime = ((e.clientX - rect.left) / rect.width) * a.duration;
  };

  return (
    <section className="relative py-32 px-6">
      <div className="max-w-3xl mx-auto">
        <div className="text-center mb-16">
          <div className="reveal flex items-center justify-center gap-3 mb-4">
            <div className="h-px w-12 bg-gradient-to-r from-transparent to-gold-400" />
            <Music className="w-4 h-4 text-gold-400" />
            <div className="h-px w-12 bg-gradient-to-l from-transparent to-gold-400" />
          </div>
          <h2 className="reveal font-serif italic text-4xl sm:text-5xl md:text-6xl text-cream mb-4">
            Our <span className="gradient-text">Soundtrack</span>
          </h2>
          <p className="reveal text-cream/60">The song that plays every time I think of you.</p>
        </div>
        <div className="reveal-scale relative rounded-3xl border border-rose-500/20 bg-gradient-to-br from-[#231a1d]/90 to-[#1A1517]/90 backdrop-blur-xl p-8 sm:p-10 shadow-[0_30px_80px_-20px_rgba(194,90,110,0.4)] shimmer-border">
          <div className="flex flex-col sm:flex-row items-center sm:items-start gap-6">
            <div className="relative w-28 h-28 sm:w-32 sm:h-32 rounded-2xl overflow-hidden flex-shrink-0 border border-rose-500/30">
              <div className="absolute inset-0 bg-gradient-to-br from-rose-600 to-gold-500" />
              <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&auto=format&fit=crop" alt="Our song" className="relative w-full h-full object-cover mix-blend-overlay opacity-70" />
              <Heart className="absolute inset-0 m-auto w-8 h-8 fill-white/90 text-white/90 animate-pulse-heart" />
            </div>
            <div className="flex-1 min-w-0 w-full">
              <p className="text-gold-300 text-[10px] sm:text-xs tracking-[0.3em] uppercase mb-1">Our Song</p>
              <h3 className="font-serif italic text-xl sm:text-2xl text-cream truncate">Ishq Mubarak — Arijit Singh</h3>
              <p className="text-cream/50 text-xs sm:text-sm mt-1 truncate">The night we danced to this, I knew.</p>
              <div onClick={seek} className="mt-4 h-1.5 rounded-full bg-cream/10 cursor-pointer overflow-hidden group">
                <div className="h-full bg-gradient-to-r from-rose-400 to-gold-400 transition-[width] duration-200" style={{ width: `${progress}%` }} />
              </div>
              <button onClick={togglePlay} className="mt-5 group flex items-center gap-3 px-6 py-3 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-100 hover:bg-rose-500/30 hover:shadow-[0_0_30px_-5px_rgba(251,113,133,0.7)] transition-all duration-300">
                {playing ? <Pause className="w-4 h-4 fill-current" /> : <Play className="w-4 h-4 fill-current" />}
                <span className="text-xs tracking-widest uppercase">{playing ? "Pause" : "Play Our Song"}</span>
              </button>
            </div>
          </div>
          <p className="reveal mt-8 pt-6 border-t border-cream/10 text-cream/70 italic font-serif text-base sm:text-lg leading-relaxed">
            "Every lyric reminds me of us. From the first note to the last, this song is the sound of my heart choosing you — again and again, without hesitation."
          </p>
          <audio ref={audioRef} src="song/ISHQ MUBARAK Full Video Song Tum Bin 2 Arijit Singh Neha Sharma, Aditya Seal & Aashim Gulati.mp3" onTimeUpdate={onTime} onEnded={() => setPlaying(false)} />
        </div>
      </div>
    </section>
  );
}

/* ============ FINALE ============ */
const dreams = [
  { icon: Plane, title: "Travel the World", text: "Passport in hand, your hand in mine." },
  { icon: HomeIcon, title: "Build Our Home", text: "A little place filled with laughter and love." },
  { icon: Sparkles, title: "Grow Together", text: "Chasing dreams, side by side, always." },
  { icon: InfinityIcon, title: "Forever & Always", text: "Every version of you, every version of us." },
];

function Finale() {
  const [answered, setAnswered] = useState(false);

  const celebrate = () => {
    setAnswered(true);
    const colors = ["#FB7185", "#E8C9A0", "#C25A6E", "#FFF1F2"];
    const end = Date.now() + 4000;

    (function frame() {
      confetti({ particleCount: 3, angle: 60, spread: 70, origin: { x: 0, y: 0.7 }, colors, shapes: ["circle"], scalar: 1.2 });
      confetti({ particleCount: 3, angle: 120, spread: 70, origin: { x: 1, y: 0.7 }, colors, shapes: ["circle"], scalar: 1.2 });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();

    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors, scalar: 1.3 });
  };

  return (
    <section className="relative py-32 px-6">
      <div className="max-w-4xl mx-auto">
        <div className="text-center mb-20">
          <div className="reveal flex items-center justify-center gap-3 mb-4">
            <div className="h-px w-12 bg-gradient-to-r from-transparent to-rose-400" />
            <Heart className="w-4 h-4 text-rose-400 fill-rose-400" />
            <div className="h-px w-12 bg-gradient-to-l from-transparent to-rose-400" />
          </div>
          <h2 className="reveal font-serif italic text-4xl sm:text-5xl md:text-6xl text-cream mb-4">
            The Future <span className="gradient-text">We Build Together</span>
          </h2>
          <p className="reveal text-cream/60 max-w-xl mx-auto">
            Every tomorrow I imagine begins and ends with you.
          </p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-20">
          {dreams.map((d, i) => {
            const I = d.icon;
            return (
              <div key={i} className="reveal-scale rounded-2xl border border-rose-500/20 bg-gradient-to-br from-[#231a1d] to-[#1A1517] p-8 card-lift group" style={{ transitionDelay: `${i * 120}ms` }}>
                <I className="w-8 h-8 text-gold-400 mb-4 group-hover:scale-110 transition-transform duration-500" />
                <h3 className="font-serif italic text-2xl text-rose-200 mb-2">{d.title}</h3>
                <p className="text-cream/60">{d.text}</p>
              </div>
            );
          })}
        </div>

        <div className="reveal-scale relative rounded-3xl border border-gold-400/30 bg-gradient-to-br from-rose-700/30 via-[#2A1F24] to-[#1A1517] p-10 sm:p-16 text-center shadow-[0_40px_100px_-30px_rgba(232,201,160,0.4)] overflow-hidden">
          <div className="absolute -top-20 -right-20 w-60 h-60 rounded-full bg-rose-500/30 glow-orb" />
          <div className="absolute -bottom-20 -left-20 w-60 h-60 rounded-full bg-gold-400/20 glow-orb" />
          <div className="relative z-10">
            <p className="text-gold-300 tracking-[0.3em] uppercase text-xs mb-6">One Last Question</p>
            <h3 className="font-serif italic text-4xl sm:text-5xl md:text-6xl text-cream mb-6 leading-tight">
              Will You Marry Me,<br /><span className="gradient-text">My Forever?</span>
            </h3>
            <p className="text-cream/70 max-w-lg mx-auto mb-10 text-base sm:text-lg leading-relaxed">
              I've already chosen you a thousand times over. All I need now is your yes — and I promise to spend a lifetime earning it.
            </p>
            {!answered ? (
              <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button onClick={celebrate} className="w-full sm:w-auto px-10 py-4 rounded-full bg-gradient-to-r from-rose-500 to-rose-600 text-white tracking-widest uppercase text-sm font-medium hover:shadow-[0_0_50px_-5px_rgba(251,113,133,0.9)] hover:scale-105 transition-all duration-300">
                  Yes 💍
                </button>
                <button onClick={celebrate} className="w-full sm:w-auto px-10 py-4 rounded-full border border-gold-400/50 text-gold-300 tracking-widest uppercase text-sm font-medium hover:bg-gold-400/10 hover:shadow-[0_0_40px_-5px_rgba(232,201,160,0.7)] hover:scale-105 transition-all duration-300">
                  Yes, A Million Times ✨
                </button>
              </div>
            ) : (
              <div>
                <div className="text-6xl mb-6">💖</div>
                <p className="font-script text-3xl sm:text-4xl text-rose-300 mb-3">She said yes!</p>
                <p className="text-cream/70 italic font-serif text-lg">Forever begins now. I love you, always.</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============ APP ============ */
function App() {
  useScrollReveal();
  return (
    <div className="relative min-h-screen bg-charcoal overflow-x-hidden">
      <FloatingParticles />
      <main className="relative z-10">
        <Hero />
        <Timeline />
        <Reasons />
        <Soundtrack />
        <Finale />
      </main>
      <footer className="text-center py-10 text-cream/40 text-sm relative z-10">
        Made with <span className="text-rose-400">❤️</span> for my forever.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
